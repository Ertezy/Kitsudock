[package]
name = "kitsudock"
version = "0.1.0"
description = "Free Windows launcher for gacha games with promo codes, banners and videos"
authors = ["Ertezy"]
license = "MIT"
repository = "https://github.com/Ertezy/Kitsudock"
edition = "2021"

[lib]
name = "kitsudock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: обслуживает файлы кеша картинок по схеме asset:// (см.
# assetProtocol в tauri.conf.json и src/images.rs).
# tray-icon: значок в области уведомлений (см. src/tray.rs).
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Запоминает размер и положение окна между запусками.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows registry access: Steam install path (custom installs).
winreg = "0.55"
# Small blocking https client for the remote hub. TLS is rustls with the bundled
# webpki-roots (the default `tls` feature), not native-tls / the Windows store.
ureq = { version = "2", features = ["json"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.9.1"
log = "0.4.34"

[dev-dependencies]
# Нужен только тесту уборки кеша: выставить файлу метку доступа в прошлое.
filetime = "0.2"
