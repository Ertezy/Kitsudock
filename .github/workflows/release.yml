name: release

# Выпуск версии — один тег. Пуш тега vX.Y.Z собирает установщик NSIS на машине
# GitHub и создаёт черновик релиза с ним; владелец проверяет и публикует.
# Сборка здесь, а не на машине владельца: по коду в репозитории видно, из чего
# собран установщик.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Все действия закреплены на коммит, а не на тег: тег можно переставить,
      # коммит нельзя. Тег остался в комментарии, обновления предлагает dependabot.
      # Токен в .git/config после checkout не нужен: дальше ничего не пушится.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      # rustup на windows-latest уже стоит; ставим актуальный stable.
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: npm ci

      # Номер в теге и в tauri.conf.json обязан совпадать: иначе в релизе
      # лежал бы установщик с другой версией в имени и в «Программах».
      # Тег приходит через переменную окружения, а не подстановкой в текст
      # скрипта: имя тега задаёт тот, кто его создаёт, и в тексте скрипта оно
      # было бы кодом.
      - name: Версия тега = версия приложения
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($conf.version)" -ne $env:TAG) {
            throw "тег $($env:TAG), а в tauri.conf.json версия $($conf.version)"
          }

      # В установщик кладётся самый свежий файл данных — на случай первого
      # запуска без интернета.
      - run: npm run update-hub

      # Автообновления у приложения нет, поэтому файл для него не выкладывается.
      # Имя установщика постоянное, без номера версии: тогда ссылка
      # releases/latest/download/Kitsudock-setup.exe в README всегда скачивает
      # последнюю версию одним кликом.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kitsudock ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Kitsudock-setup[ext]
          releaseBody: |
            Free Windows launcher for Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Wuthering Waves and Arknights: Endfield.

            **Install:** download [Kitsudock-setup.exe](https://github.com/Ertezy/Kitsudock/releases/download/${{ github.ref_name }}/Kitsudock-setup.exe) and run it. Windows 10 or 11, 64-bit; no administrator rights needed. The installer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC" — click **More info → Run anyway**. To update, run the new installer over the old version. More in the [README](https://github.com/Ertezy/Kitsudock#readme).

            **Установка:** скачайте [Kitsudock-setup.exe](https://github.com/Ertezy/Kitsudock/releases/download/${{ github.ref_name }}/Kitsudock-setup.exe) и запустите. Windows 10 или 11, 64-бит; права администратора не нужны. Установщик пока не подписан, поэтому SmartScreen может написать «Система Windows защитила ваш компьютер» — нажмите **Подробнее → Выполнить в любом случае**. Чтобы обновиться, запустите новый установщик поверх старой версии. Подробнее — в [README на русском](https://github.com/Ertezy/Kitsudock/blob/main/README.ru.md).

            [Code signing policy](https://github.com/Ertezy/Kitsudock#code-signing-policy)
